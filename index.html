
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WAN Network Status Checker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 24px 16px;
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 4px;
      color: #38bdf8;
      letter-spacing: 1px;
    }

    .subtitle {
      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 24px;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .controls label {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    select, button {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      font-size: 0.85rem;
      cursor: pointer;
    }

    select {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
    }

    .btn-start {
      background: #0ea5e9;
      color: white;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn-start:hover { background: #0284c7; }
    .btn-start.running { background: #dc2626; }
    .btn-start.running:hover { background: #b91c1c; }

    .btn-check {
      background: #334155;
      color: #e2e8f0;
    }
    .btn-check:hover { background: #475569; }

    .overall-status {
      text-align: center;
      margin-bottom: 24px;
      padding: 12px;
      border-radius: 12px;
      background: #1e293b;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 0.5px;
      border: 1px solid #334155;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .card {
      background: #1e293b;
      border-radius: 14px;
      padding: 18px;
      border: 1px solid #334155;
      transition: border-color 0.3s;
    }

    .card.online  { border-color: #22c55e; }
    .card.offline { border-color: #ef4444; }
    .card.slow    { border-color: #f59e0b; }
    .card.checking { border-color: #38bdf8; }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .card-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      background: #0f172a;
    }

    .card-title { font-weight: bold; font-size: 0.95rem; }
    .card-ip    { font-size: 0.75rem; color: #64748b; }

    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .badge-online  { background: #14532d; color: #4ade80; }
    .badge-offline { background: #450a0a; color: #f87171; }
    .badge-slow    { background: #451a03; color: #fbbf24; }
    .badge-checking{ background: #0c1a2e; color: #38bdf8; }
    .badge-idle    { background: #1e293b; color: #64748b; border: 1px solid #334155; }

    .latency {
      font-size: 1.6rem;
      font-weight: bold;
      color: #e2e8f0;
      margin: 6px 0 2px;
    }

    .latency span { font-size: 0.8rem; color: #64748b; font-weight: normal; }

    .history-bar {
      display: flex;
      gap: 3px;
      margin-top: 12px;
      align-items: flex-end;
      height: 32px;
    }

    .bar-item {
      flex: 1;
      border-radius: 3px;
      background: #334155;
      min-height: 4px;
      transition: background 0.3s;
    }

    .bar-item.ok   { background: #22c55e; }
    .bar-item.warn { background: #f59e0b; }
    .bar-item.fail { background: #ef4444; }

    .last-checked {
      font-size: 0.72rem;
      color: #475569;
      margin-top: 8px;
    }

    .pulse {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 1.2s infinite;
    }
    .pulse.green  { background: #22c55e; }
    .pulse.red    { background: #ef4444; }
    .pulse.yellow { background: #f59e0b; }
    .pulse.blue   { background: #38bdf8; }
    .pulse.gray   { background: #475569; animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    .footer {
      text-align: center;
      margin-top: 32px;
      font-size: 0.72rem;
      color: #334155;
    }
  </style>
</head>
<body>

<h1>🌐 WAN Network Status Checker</h1>
<p class="subtitle">Monitoring kondisi koneksi WAN via DNS Response Time</p>

<div class="controls">
  <label>Interval:</label>
  <select id="intervalSelect">
    <option value="5000">5 detik</option>
    <option value="10000" selected>10 detik</option>
    <option value="30000">30 detik</option>
    <option value="60000">1 menit</option>
  </select>
  <button class="btn-check" onclick="checkAll()">🔁 Cek Sekarang</button>
  <button class="btn-start" id="toggleBtn" onclick="toggleAuto()">▶ Auto Monitor</button>
</div>

<div class="overall-status" id="overallStatus">
  <span class="pulse gray"></span> Belum dicek — klik "Cek Sekarang"
</div>

<div class="grid" id="grid"></div>

<div class="footer">
  Menggunakan HTTP fetch sebagai pengganti ICMP ping (browser limitation) &nbsp;|&nbsp;
  Latency &lt;100ms = Baik · 100–300ms = Lambat · &gt;300ms / Error = Offline
</div>

<script>
const DNS_TARGETS = [
  {
    name: "Cloudflare DNS",
    ip: "1.1.1.1",
    url: "https://1.1.1.1/dns-query?name=cloudflare.com&type=A",
    icon: "🟠",

  },
  {
    name: "Google DNS",
    ip: "8.8.8.8",
    url: "https://dns.google/resolve?name=google.com&type=A",
    icon: "🔵",
    headers: {}
  },
  {
    name: "Quad9 DNS",
    ip: "9.9.9.9",
    url: "https://dns.quad9.net:5053/dns-query?name=quad9.net&type=A",
    icon: "🟣",
    headers: { "Accept": "application/dns-json" }
  },
  {
    name: "OpenDNS",
    ip: "208.67.222.222",
    url: "https://doh.opendns.com/dns-query?name=opendns.com&type=A",
    icon: "🟡",
    headers: { "Accept": "application/dns-json" }
  },
  {
    name: "AdGuard DNS",
    ip: "94.140.14.14",
    url: "https://dns.adguard-dns.com/resolve?name=adguard.com&type=A",
    icon: "🟢",
    headers: {}
  }
];

const HISTORY_MAX = 20;
const history = DNS_TARGETS.map(() => []);
let autoTimer = null;
let isRunning = false;

// Build cards
const grid = document.getElementById('grid');
DNS_TARGETS.forEach((t, i) => {
  grid.innerHTML += `
    <div class="card" id="card-${i}">
      <div class="card-header">
        <div class="card-icon">${t.icon}</div>
        <div>
          <div class="card-title">${t.name}</div>
          <div class="card-ip">${t.ip}</div>
        </div>
      </div>
      <div class="status-badge badge-idle" id="badge-${i}">Idle</div>
      <div class="latency" id="latency-${i}">— <span>ms</span></div>
      <div class="history-bar" id="bar-${i}">
        ${Array(HISTORY_MAX).fill('<div class="bar-item"></div>').join('')}
      </div>
      <div class="last-checked" id="last-${i}">Belum dicek</div>
    </div>`;
});

async function ping(target) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 5000);
  const t0 = performance.now();
  try {
    await fetch(target.url, {
      method: 'GET',
      headers: target.headers,
      signal: controller.signal,
      cache: 'no-store'
    });
    const latency = Math.round(performance.now() - t0);
    clearTimeout(timeout);
    return latency;
  } catch (e) {
    clearTimeout(timeout);
    return null;
  }
}

function getStatusFromLatency(lat) {
  if (lat === null)  return 'offline';
  if (lat < 100)     return 'online';
  if (lat < 300)     return 'slow';
  return 'offline';
}

function updateCard(i, latency) {
  const status = getStatusFromLatency(latency);
  const card   = document.getElementById(`card-${i}`);
  const badge  = document.getElementById(`badge-${i}`);
  const latEl  = document.getElementById(`latency-${i}`);
  const lastEl = document.getElementById(`last-${i}`);

  card.className = `card ${status}`;

  const badgeMap = {
    online:  ['badge-online',  '✅ Online'],
    offline: ['badge-offline', '❌ Offline'],
    slow:    ['badge-slow',    '⚠️ Lambat'],
  };
  badge.className = `status-badge ${badgeMap[status][0]}`;
  badge.textContent = badgeMap[status][1];

  latEl.innerHTML = latency !== null
    ? `${latency} <span>ms</span>`
    : `— <span>ms (timeout)</span>`;

  const now = new Date();
  lastEl.textContent = `Dicek: ${now.toLocaleTimeString('id-ID')}`;

  // Update history
  history[i].push({ latency, status });
  if (history[i].length > HISTORY_MAX) history[i].shift();

  const barContainer = document.getElementById(`bar-${i}`);
  const bars = barContainer.querySelectorAll('.bar-item');
  bars.forEach((b, idx) => {
    const h = history[i][idx];
    if (!h) { b.className = 'bar-item'; b.style.height = '4px'; return; }
    const cls = h.status === 'online' ? 'ok' : h.status === 'slow' ? 'war
